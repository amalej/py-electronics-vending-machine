name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          # Ensure app_icon.png is at repo root. Adjust path if necessary.
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "electronics-vending-machine" \
            --icon "app_icon.png" \
            src/main.py

      - name: List dist folder
        run: dir dist

      - name: Prepare release bundle
        shell: bash
        run: |
          set -e
          ART_DIR="release_artifact"
          rm -rf "$ART_DIR"
          mkdir -p "$ART_DIR"

          # Copy the built EXE (if present)
          if [ -f "dist/electronics-vending-machine.exe" ]; then
            cp "dist/electronics-vending-machine.exe" "$ART_DIR/"
          else
            echo "Warning: EXE not found at dist/electronics-vending-machine.exe"
          fi

          echo '{"currency_symbol": "\u20b1"}' > config.json
          echo '[]' > item_list.json

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronics-vending-machine-bundle
          path: release_artifact
