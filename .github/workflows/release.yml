name: Build Windows EXE

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          # Ensure app_icon.png is at repo root. Adjust path if necessary.
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "electronics-vending-machine" \
            --icon "app_icon.png" \
            src/main.py

      - name: List dist folder
        run: dir dist

      - name: Prepare release bundle
        shell: bash
        run: |
          set -e
          # This will be the name of the folder inside the zip
          ART_DIR="artifacts/electronics-vending-machine-bundle"
          mkdir -p "$ART_DIR"

          # Copy the built EXE (if present)
          if [ -f "dist/electronics-vending-machine.exe" ]; then
            cp "dist/electronics-vending-machine.exe" "$ART_DIR/"
          else
            echo "Warning: EXE not found at dist/electronics-vending-machine.exe"
          fi

          # Create config and item list inside the artifact directory
          echo '{"currency_symbol": "\u20b1"}' > "$ART_DIR/config.json"
          echo '[]' > "$ART_DIR/item_list.json"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronics-vending-machine-bundle
          path: artifacts/electronics-vending-machine-bundle

      - name: Zip release artifact
        shell: powershell
        run: Compress-Archive -Path artifacts/electronics-vending-machine-bundle -DestinationPath electronics-vending-machine-bundle.zip

      - name: Upload asset to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.UPLOAD_RELEASE_ASSET_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./electronics-vending-machine-bundle.zip
          asset_name: electronics-vending-machine-bundle.zip
          asset_content_type: application/zip
